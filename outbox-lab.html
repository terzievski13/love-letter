<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:,">
<title>outbox lab — three ways to keep her letters</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Cormorant+Garamond:wght@600&display=swap">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14100e;
    overflow: hidden;
    font-family: Fraunces, "Times New Roman", serif;
    color: #fff3e6;
    -webkit-font-smoothing: antialiased;
  }
  #lab { position: fixed; inset: 0; }

  /* ---------------------------------------------------------------- */
  /* developer control bar — same as picker-lab, never seen by her    */
  /* ---------------------------------------------------------------- */
  .lab { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .lab-bar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 8px 12px;
    background: #0d0a08;
    border-bottom: 1px solid #2c221b;
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
    font-size: 12px;
    color: #c9b8a8;
    z-index: 900;
  }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > label {
    font-size: 9.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: #7a6759;
  }
  .seg { display: flex; border: 1px solid #33271f; border-radius: 7px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent;
    color: #c0ad9c; font: inherit; padding: 5px 9px; cursor: pointer; white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid #33271f; }
  .seg button:hover { background: #221a14; }
  .seg button[data-on="1"] { background: #e3c28d; color: #20150f; font-weight: 600; }
  .size-ctl { display: flex; align-items: center; gap: 7px; }
  .size-ctl input { width: 110px; accent-color: #e3c28d; }
  .size-ctl output { min-width: 36px; font-variant-numeric: tabular-nums; color: #e3c28d; }
  .lab-note { color: #6d5c4e; font-style: italic; margin-left: auto; }
  .ghost-btn {
    appearance: none; border: 1px solid #33271f; border-radius: 7px;
    background: transparent; color: #c0ad9c; font: inherit; padding: 5px 9px; cursor: pointer;
  }
  .ghost-btn:hover { background: #221a14; }
  .bar-peek {
    position: fixed; bottom: 10px; left: 10px; z-index: 950;
    width: 34px; height: 34px; border-radius: 17px;
    border: 1px solid rgba(255,243,230,.2); background: rgba(20,10,6,.5);
    color: rgba(255,243,230,.75); font-size: 15px; cursor: pointer;
    backdrop-filter: blur(6px); display: grid; place-items: center;
  }

  /* ---------------------------------------------------------------- */
  /* the stage — stands in for the inside of the mailbox              */
  /* ---------------------------------------------------------------- */
  .lab-stage {
    flex: 1 1 auto; position: relative; overflow: hidden;
    display: grid; place-items: center;
    background: #100c0a;
  }
  .stage {
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 42%, #7a5136 0%, #4a3020 38%, #23150d 72%, #150c07 100%);
  }
  .stage.is-full { position: absolute; inset: 0; }
  .stage.is-phone {
    width: 392px; height: min(846px, 100%);
    border-radius: 24px;
    border: 1px solid #3a2e26;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .stage.is-phone iframe { display: block; width: 390px; height: 100%; border: 0; border-radius: 23px; }
  .stage-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(20,12,8,0) 25%, rgba(20,12,8,0.8) 78%);
  }

  /* ---------------------------------------------------------------- */
  /* copied from index.html: the real deck + reader styling, so the   */
  /* real deck.jsx looks here exactly as it does on the site           */
  /* ---------------------------------------------------------------- */
  .deck { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .deck-card { position: absolute; left: 50%; top: 50%; width: 360px; height: 230px; margin: -115px 0 0 -180px; cursor: pointer; }
  .deck-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 21px; z-index: 300;
    border: 1px solid rgba(255,243,230,.22); background: rgba(20,10,6,.5);
    color: #fff3e6; font-size: 18px; cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(6px);
  }
  .deck-arrow:hover { background: rgba(40,20,12,.8); }
  .deck-arrow[disabled] { opacity: .18; cursor: default; }
  .deck-rail {
    position: absolute; left: 12%; right: 12%; bottom: 46px; height: 26px; z-index: 300;
    display: flex; align-items: center; touch-action: none; cursor: pointer;
  }
  .deck-rail-track { position: relative; height: 3px; width: 100%; border-radius: 2px; background: rgba(255,243,230,.16); }
  .deck-rail-thumb { position: absolute; top: -3px; height: 9px; border-radius: 5px; background: #e8c79a; }
  .deck-cap {
    position: absolute; left: -60px; right: -60px; top: 100%; margin-top: 16px;
    text-align: center; transition: opacity .3s ease; pointer-events: none;
  }
  .deck-cap-title { font-family: Caveat, cursive; font-size: 27px; line-height: 1.15; color: #fff3e6; }
  .deck-cap-date {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; color: rgba(255,243,230,.45); margin-top: 3px;
  }
  .deck-pos {
    position: absolute; left: 0; right: 0; bottom: 74px; text-align: center; z-index: 300;
    font-family: Caveat, cursive; font-size: 19px; color: rgba(255,243,230,.75);
  }
  @keyframes newPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,206,130,.42), 0 8px 18px rgba(0,0,0,.4); }
    50%     { box-shadow: 0 0 22px 5px rgba(255,206,130,.30), 0 8px 18px rgba(0,0,0,.4); }
  }
  .is-new { animation: newPulse 2.8s ease-in-out infinite; }
  .is-read { filter: saturate(.86) brightness(.9); }
  .new-tag {
    font-family: Caveat, cursive; font-size: 15px; color: #3a2820;
    background: #ffd79a; border-radius: 999px; padding: 0 8px;
    line-height: 19px; display: inline-block; white-space: nowrap;
  }
  .reader { position: fixed; inset: 0; z-index: 1000; }
  .reader-scrim { position: absolute; inset: 0; background: rgba(12,7,4,.72); }
  .reader-stage { position: absolute; inset: 0; pointer-events: none; }
  .reader-stage > * { pointer-events: auto; }
  .reader-ghost {
    position: absolute; left: 50%; top: 50%; width: 360px; height: 230px;
    margin: -115px 0 0 -180px; filter: drop-shadow(0 24px 36px rgba(0,0,0,.45));
    perspective: 1000px; transform-style: preserve-3d;
  }
  .back-btn {
    position: absolute; top: 24px; left: 24px;
    padding: 15px 27px;
    border-radius: 999px;
    border: 1px solid rgba(255,243,230,0.25);
    background: rgba(20,10,6,0.55);
    color: #fff3e6;
    font-family: Fraunces, serif;
    font-size: 14px;
    font-style: italic;
    cursor: pointer;
    backdrop-filter: blur(8px);
    z-index: 200;
  }
  .back-btn:hover { background: rgba(40,20,12,0.85); }
  .inside-hint {
    position: absolute; left: 0; right: 0; top: 8%;
    text-align: center;
    color: #fff3e6; font-family: Caveat, cursive; font-size: 26px;
    opacity: 0.7; pointer-events: none; z-index: 5;
  }

  /* ---------------------------------------------------------------- */
  /* new: shared bits for her letters                                 */
  /* ---------------------------------------------------------------- */
  .pill-btn {
    position: absolute; z-index: 320;
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid rgba(255,243,230,.3);
    background: rgba(140,70,88,.72);
    color: #fff3e6; font-family: Caveat, cursive; font-size: 21px; line-height: 1;
    cursor: pointer; backdrop-filter: blur(8px);
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  .pill-btn:hover { background: rgba(160,80,100,.85); }
  .empty-shelf {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(320px, 80%); text-align: center; z-index: 10;
    font-family: Caveat, cursive; color: rgba(255,243,230,.75);
  }
  .empty-shelf .big { font-size: 28px; color: #fff3e6; }
  .empty-shelf .small { font-size: 19px; margin-top: 6px; }

  /* A: the switch */
  .switch {
    position: absolute; left: 50%; top: 26px; transform: translateX(-50%); z-index: 320;
    display: flex; padding: 3px; border-radius: 999px;
    background: rgba(20,10,6,.55); border: 1px solid rgba(255,243,230,.22);
    backdrop-filter: blur(8px);
  }
  .switch button {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px;
    padding: 7px 18px; background: transparent; color: rgba(255,243,230,.7);
    font-family: Caveat, cursive; font-size: 21px; line-height: 1;
    transition: background .25s, color .25s;
  }
  .switch button[data-on="1"] { background: #e8c79a; color: #2a1a14; }
  .switch .count { font-size: 15px; opacity: .7; margin-left: 5px; }

  /* B: the tied bundle */
  /* --bs is the "bundle size" control in the lab bar; it scales from the
     bottom-right corner, so the bundle grows into the empty space */
  .bundle {
    position: absolute; right: 26px; bottom: 118px; z-index: 320;
    width: 112px; height: 92px; cursor: pointer;
    appearance: none; border: 0; background: transparent; padding: 0;
    transform: scale(var(--bs, 1)); transform-origin: bottom right;
  }
  .bundle-env {
    position: absolute; left: 6px; width: 100px; height: 64px; border-radius: 3px;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  .bundle-ribbon-v { position: absolute; left: 52px; top: 4px; width: 7px; height: 70px; background: #8c4658; border-radius: 2px; }
  .bundle-ribbon-h { position: absolute; left: 4px; top: 36px; width: 104px; height: 6px; background: #8c4658; border-radius: 2px; }
  .bundle-bow {
    position: absolute; left: 44px; top: 29px; width: 23px; height: 19px;
    font-size: 19px; line-height: 19px; text-align: center; color: #a85a6e;
  }
  .bundle-label {
    position: absolute; left: -20px; right: -20px; top: 80px; text-align: center;
    font-family: Caveat, cursive; font-size: 19px; color: #fff3e6;
    text-shadow: 0 1px 8px rgba(20,10,6,.8);
  }
  .bundle:hover .bundle-env { transform: translateY(-2px); }
  .bundle-empty { opacity: .45; }

  /* C: two shelves */
  .shelves { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
  .shelf-track {
    position: absolute; top: 0; bottom: 0; left: 0; width: 200%;
    display: flex; transition: transform .7s cubic-bezier(.4,0,.2,1);
  }
  .shelf { position: relative; width: 50%; height: 100%; overflow: hidden; }
  .shelf-head {
    position: absolute; left: 0; right: 0; top: 22px; z-index: 320;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: Caveat, cursive; color: #fff3e6;
  }
  .shelf-head .name { font-size: 29px; min-width: 150px; text-align: center; }
  .shelf-head button {
    appearance: none; border: 1px solid rgba(255,243,230,.22); background: rgba(20,10,6,.5);
    color: #fff3e6; width: 34px; height: 34px; border-radius: 17px; cursor: pointer;
    font-size: 16px; backdrop-filter: blur(6px);
  }
  .shelf-head button[disabled] { opacity: .2; cursor: default; }
  .shelf-dots { position: absolute; left: 0; right: 0; top: 62px; z-index: 320; display: flex; justify-content: center; gap: 7px; }
  .shelf-dots span { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,243,230,.25); transition: background .3s; }
  .shelf-dots span[data-on="1"] { background: #e8c79a; }

  /* her own letter, open: edit / delete float over the reader */
  .own-actions {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1100;
    display: flex; gap: 10px; animation: fadeIn .4s .9s both;
  }
  .own-actions button {
    font-family: Caveat, cursive; font-size: 20px; padding: 7px 18px; border-radius: 999px;
    white-space: nowrap; cursor: pointer; border: 1px solid rgba(255,243,230,.3);
    background: rgba(20,10,6,.6); color: #fff3e6; backdrop-filter: blur(8px);
  }
  .own-actions button.danger { background: rgba(122,40,40,.7); }

  /* the composer (her writing screen) */
  .composer-wrap {
    position: fixed; inset: 0; z-index: 1200;
    background: rgba(12,7,4,.78); display: grid; place-items: center;
    animation: fadeIn .35s ease both; padding: 14px;
  }
  .composer {
    width: min(460px, 100%); max-height: 100%; overflow-y: auto;
    border-radius: 6px; padding: 22px 22px 18px;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(120,90,60,0.13) 31px, rgba(120,90,60,0.13) 32px),
      linear-gradient(180deg, #fdf6e9 0%, #f6e9d2 100%);
    color: #3a2820; box-shadow: 0 30px 60px rgba(0,0,0,.5);
    font-family: Caveat, cursive;
  }
  .composer h2 { margin: 0 0 10px; font-family: Fraunces, serif; font-style: italic; font-weight: 400; font-size: 22px; }
  .composer input[type=text], .composer input[type=password], .composer textarea {
    width: 100%; border: 0; border-bottom: 1px solid rgba(120,90,60,.35);
    background: transparent; color: #3a2820; outline: none;
    font-family: Caveat, cursive; font-size: 22px; padding: 4px 2px;
  }
  .composer textarea { min-height: 190px; resize: vertical; line-height: 32px; border: 1px dashed rgba(120,90,60,.3); border-radius: 4px; padding: 6px 8px; margin-top: 12px; }
  .composer .row-label { font-size: 17px; color: #7a5a4a; margin: 14px 0 6px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatches button {
    width: 30px; height: 30px; border-radius: 15px; cursor: pointer;
    border: 2px solid rgba(58,40,32,.18);
  }
  .swatches button[data-on="1"] { border-color: #3a2820; box-shadow: 0 0 0 2px #fdf6e9 inset; }
  .composer .preview { display: flex; justify-content: center; margin: 16px 0 6px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
  .composer .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .composer .actions button {
    font-family: Caveat, cursive; font-size: 21px; padding: 6px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(58,40,32,.3); background: transparent; color: #3a2820;
  }
  .composer .actions button.primary { background: #8c4658; color: #fff3e6; border-color: #8c4658; }
  .composer .actions button[disabled] { opacity: .4; cursor: default; }
  .composer .hint { font-size: 17px; color: #7a5a4a; margin-top: 6px; }
  .composer .err { font-size: 18px; color: #a5443a; margin-top: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 1300;
    font-family: Caveat, cursive; font-size: 24px; color: #fff3e6;
    text-shadow: 0 1px 10px rgba(20,10,6,.8); animation: fadeIn .4s ease both; pointer-events: none;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 720px) {
    .back-btn { padding: 9px 16px; font-size: 12px; }
    .inside-hint { top: 14%; }
    .reader-stage { transform: scale(0.8); transform-origin: 50% 50%; }
    .switch { top: 70px; }
    .bundle { bottom: 124px; right: 14px; transform: scale(calc(var(--bs, 1) * .82)); }
    .pill-btn { font-size: 18px; padding: 8px 14px; }
  }
  @media (max-width: 520px) {
    .lab-bar { gap: 6px 10px; padding: 6px 8px; font-size: 11px; }
    .lab-note { display: none; }
  }
</style>
</head>
<body>
  <div id="lab"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- the real letter data, the real envelope art / letter unfold, and the real deck -->
  <script type="text/babel" src="letters.jsx"></script>
  <script type="text/babel" src="envelope.jsx"></script>
  <script type="text/babel" src="deck.jsx"></script>
  <script type="text/babel" src="outbox-lab.jsx"></script>
</body>
</html>

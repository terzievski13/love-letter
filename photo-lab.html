<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:,">
<title>photo lab — four ways to put a photo in a letter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Cormorant+Garamond:wght@600&family=Neucha&family=Bad+Script&display=swap">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14100e;
    overflow: hidden;
    font-family: Fraunces, "Times New Roman", serif;
    color: #fff3e6;
    -webkit-font-smoothing: antialiased;
  }
  #lab { position: fixed; inset: 0; }

  /* ---------------------------------------------------------------- */
  /* developer control bar — same as picker-lab, never seen by her    */
  /* ---------------------------------------------------------------- */
  .lab { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .lab-bar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 8px 12px;
    background: #0d0a08;
    border-bottom: 1px solid #2c221b;
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
    font-size: 12px;
    color: #c9b8a8;
    z-index: 900;
  }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > label {
    font-size: 9.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: #7a6759;
  }
  .seg { display: flex; border: 1px solid #33271f; border-radius: 7px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent;
    color: #c0ad9c; font: inherit; padding: 5px 9px; cursor: pointer; white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid #33271f; }
  .seg button:hover { background: #221a14; }
  .seg button[data-on="1"] { background: #e3c28d; color: #20150f; font-weight: 600; }
  .lab-note { color: #6d5c4e; font-style: italic; margin-left: auto; }
  .ghost-btn {
    appearance: none; border: 1px solid #33271f; border-radius: 7px;
    background: transparent; color: #c0ad9c; font: inherit; padding: 5px 9px; cursor: pointer;
  }
  .ghost-btn:hover { background: #221a14; }
  .bar-peek {
    position: fixed; bottom: 10px; left: 10px; z-index: 950;
    width: 34px; height: 34px; border-radius: 17px;
    border: 1px solid rgba(255,243,230,.2); background: rgba(20,10,6,.5);
    color: rgba(255,243,230,.75); font-size: 15px; cursor: pointer;
    backdrop-filter: blur(6px); display: grid; place-items: center;
  }

  /* ---------------------------------------------------------------- */
  /* the stage — stands in for the inside of the mailbox              */
  /* ---------------------------------------------------------------- */
  .lab-stage {
    flex: 1 1 auto; position: relative; overflow: hidden;
    display: grid; place-items: center;
    background: #100c0a;
  }
  .stage {
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 42%, #7a5136 0%, #4a3020 38%, #23150d 72%, #150c07 100%);
  }
  .stage.is-full { position: absolute; inset: 0; }
  .stage.is-phone {
    width: 392px; height: min(846px, 100%);
    border-radius: 24px;
    border: 1px solid #3a2e26;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .stage.is-phone iframe { display: block; width: 390px; height: 100%; border: 0; border-radius: 23px; }
  .stage-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(20,12,8,0) 25%, rgba(20,12,8,0.8) 78%);
  }

  /* ---------------------------------------------------------------- */
  /* copied from index.html: the real deck + reader styling, so the   */
  /* real deck.jsx looks here exactly as it does on the site           */
  /* ---------------------------------------------------------------- */
  .deck { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .deck-card { position: absolute; left: 50%; top: 50%; width: 360px; height: 230px; margin: -115px 0 0 -180px; cursor: pointer; }
  .deck-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 21px; z-index: 300;
    border: 1px solid rgba(255,243,230,.22); background: rgba(20,10,6,.5);
    color: #fff3e6; font-size: 18px; cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(6px);
  }
  .deck-arrow:hover { background: rgba(40,20,12,.8); }
  .deck-arrow[disabled] { opacity: .18; cursor: default; }
  .deck-rail {
    position: absolute; left: 12%; right: 12%; bottom: 46px; height: 26px; z-index: 300;
    display: flex; align-items: center; touch-action: none; cursor: pointer;
  }
  .deck-rail-track { position: relative; height: 3px; width: 100%; border-radius: 2px; background: rgba(255,243,230,.16); }
  .deck-rail-thumb { position: absolute; top: -3px; height: 9px; border-radius: 5px; background: #e8c79a; }
  .deck-cap {
    position: absolute; left: -60px; right: -60px; top: 100%; margin-top: 16px;
    text-align: center; transition: opacity .3s ease; pointer-events: none;
  }
  .deck-cap-title { font-family: Caveat, cursive; font-size: 27px; line-height: 1.15; color: #fff3e6; }
  .deck-cap-date {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; color: rgba(255,243,230,.45); margin-top: 3px;
  }
  .deck-pos {
    position: absolute; left: 0; right: 0; bottom: 74px; text-align: center; z-index: 300;
    font-family: Caveat, cursive; font-size: 19px; color: rgba(255,243,230,.75);
  }
  @keyframes newPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,206,130,.42), 0 8px 18px rgba(0,0,0,.4); }
    50%     { box-shadow: 0 0 22px 5px rgba(255,206,130,.30), 0 8px 18px rgba(0,0,0,.4); }
  }
  .is-new { animation: newPulse 2.8s ease-in-out infinite; }
  .is-read { filter: saturate(.86) brightness(.9); }
  .new-tag {
    font-family: Caveat, cursive; font-size: 15px; color: #3a2820;
    background: #ffd79a; border-radius: 999px; padding: 0 8px;
    line-height: 19px; display: inline-block; white-space: nowrap;
  }
  .reader { position: fixed; inset: 0; z-index: 1000; }
  .reader-scrim { position: absolute; inset: 0; background: rgba(12,7,4,.72); }
  .reader-stage { position: absolute; inset: 0; pointer-events: none; }
  .reader-stage > * { pointer-events: auto; }
  .reader-ghost {
    position: absolute; left: 50%; top: 50%; width: 360px; height: 230px;
    margin: -115px 0 0 -180px; filter: drop-shadow(0 24px 36px rgba(0,0,0,.45));
    perspective: 1000px; transform-style: preserve-3d;
  }
  .back-btn {
    position: absolute; top: 24px; left: 24px;
    padding: 15px 27px;
    border-radius: 999px;
    border: 1px solid rgba(255,243,230,0.25);
    background: rgba(20,10,6,0.55);
    color: #fff3e6;
    font-family: Fraunces, serif;
    font-size: 14px;
    font-style: italic;
    cursor: pointer;
    backdrop-filter: blur(8px);
    z-index: 200;
  }
  .back-btn:hover { background: rgba(40,20,12,0.85); }
  .inside-hint {
    position: absolute; left: 0; right: 0; top: 8%;
    text-align: center;
    color: #fff3e6; font-family: Caveat, cursive; font-size: 26px;
    opacity: 0.7; pointer-events: none; z-index: 5;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ================================================================ */
  /* NEW: the photos                                                  */
  /* Every size is a fraction of --w (the print's width), so the same */
  /* print works at 100px in the envelope and 500px full screen.      */
  /* ================================================================ */
  .pp {
    position: relative; width: var(--w);
    transform: rotate(var(--tilt, 0deg));
    cursor: pointer; flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  .pp-img { position: relative; overflow: hidden; background: #2a1d16; }
  .pp-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .pp-img::after {  /* a faint sheen and a hairline edge, so it reads as a print, not a screen */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.10);
    background: linear-gradient(125deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 38%);
  }
  .pp-cap {  /* handwriting that belongs to the print itself */
    font-family: Caveat, cursive; color: #3a2a22; line-height: 1.05;
    font-size: calc(var(--w) * .085);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pp-under {  /* handwriting on the letter paper, just below the print */
    font-family: Caveat, cursive; color: #6a4a3a; text-align: center; line-height: 1.1;
    font-size: max(17px, calc(var(--w) * .085));
    margin-top: calc(var(--w) * .05);
    transform: rotate(-1.2deg);
  }

  /* 1 · polaroid, held by a strip of washi tape */
  .pp-polaroid {
    background: linear-gradient(180deg, #fefdf9, #f5f1e7);
    padding: calc(var(--w) * .055) calc(var(--w) * .055) 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 calc(var(--w) * .035) calc(var(--w) * .08) rgba(30,15,5,.30);
  }
  .pp-polaroid .pp-img { aspect-ratio: 1 / 1; }
  .pp-polaroid .pp-img img { filter: saturate(.92) contrast(1.03); }
  .pp-polaroid .pp-cap {
    height: calc(var(--w) * .2); display: flex; align-items: center; justify-content: center;
    padding: 0 4%;
  }
  .pp-polaroid.no-cap .pp-cap { height: calc(var(--w) * .17); }
  .pp-tape {
    position: absolute; z-index: 2; left: 50%; top: calc(var(--w) * -.055);
    width: calc(var(--w) * .42); height: calc(var(--w) * .12);
    transform: translateX(-50%) rotate(-3.5deg);
    background-color: var(--tape);
    background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 calc(var(--w)*.012), transparent calc(var(--w)*.012) calc(var(--w)*.03));
    opacity: .86;
    clip-path: polygon(0 0, 100% 0, 97% 14%, 100% 28%, 96.5% 43%, 100% 57%, 97% 72%, 100% 86%, 97% 100%, 0 100%, 3% 86%, 0 72%, 3.5% 57%, 0 43%, 3% 28%, 0 14%);
  }

  /* 2 · album corners */
  .pp-corners {
    background: #fbf8f1;
    padding: calc(var(--w) * .045);
    box-shadow: 0 1px 2px rgba(0,0,0,.16), 0 calc(var(--w) * .02) calc(var(--w) * .05) rgba(30,15,5,.24);
  }
  .pp-corner {
    position: absolute; z-index: 2; width: calc(var(--w) * .15); height: calc(var(--w) * .15);
    filter: drop-shadow(0 1px 1.2px rgba(0,0,0,.45));
  }
  .pp-corner i {
    position: absolute; inset: 0;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    background: linear-gradient(135deg, #3b2d25 0%, #2a1f19 46%, rgba(255,240,220,.35) 49.5%, #2a1f19 52%);
  }
  .pp-corner.tl { top: -2px; left: -2px; }
  .pp-corner.tr { top: -2px; right: -2px; transform: rotate(90deg); }
  .pp-corner.br { bottom: -2px; right: -2px; transform: rotate(180deg); }
  .pp-corner.bl { bottom: -2px; left: -2px; transform: rotate(270deg); }

  /* 3 · vintage print: wavy cut edge, faded colour, orange date stamp */
  .pp-deckled { filter: drop-shadow(0 calc(var(--w) * .02) calc(var(--w) * .03) rgba(30,15,5,.32)); }
  .pp-dk-card { background: linear-gradient(170deg, #f4ecda, #ece0c6); padding: calc(var(--w) * .065); }
  .pp-deckled .pp-img img { filter: sepia(.32) saturate(.78) contrast(.9) brightness(1.05); }
  .pp-deckled .pp-img::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(70,40,15,.38) 100%),
      linear-gradient(rgba(255,196,130,.13), rgba(255,196,130,.13));
  }
  .pp-datestamp {
    position: absolute; z-index: 2; right: 6%; bottom: 5%;
    font: 700 calc(var(--w) * .052) / 1 "Courier New", ui-monospace, monospace;
    letter-spacing: .06em; color: #ff9c45;
    text-shadow: 0 0 calc(var(--w) * .012) rgba(255,110,20,.95);
    opacity: .92;
  }

  /* 4 · postcard: photo on the front, a note and a stamp on the back */
  .pp-postcard { perspective: calc(var(--w) * 4); }
  .pp-pc-inner {
    position: relative; transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.4,.1,.2,1);
  }
  .pp-postcard.flipped .pp-pc-inner { transform: rotateY(180deg); }
  .pp-pc-face {
    position: absolute; inset: 0; border-radius: calc(var(--w) * .012); overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 calc(var(--w) * .03) calc(var(--w) * .07) rgba(30,15,5,.30);
  }
  .pp-pc-front { background: #fbf8f1; padding: calc(var(--w) * .03); }
  .pp-pc-front .pp-img { height: 100%; }
  .pp-pc-curl {  /* a lifted corner — says "there's another side" */
    position: absolute; right: 0; bottom: 0; z-index: 2;
    width: calc(var(--w) * .085); height: calc(var(--w) * .085);
    background: linear-gradient(315deg, rgba(0,0,0,0) 50%, #efe6d2 50%, #fffaf0 75%);
    box-shadow: -1px -1px 2px rgba(0,0,0,.15);
    border-top-left-radius: 2px;
  }
  .pp-pc-back {
    transform: rotateY(180deg);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.5), rgba(255,255,255,0) 60%),
      linear-gradient(160deg, #f8f1e2, #efe3cb);
    color: #3a2820;
    display: grid; grid-template-columns: 56% 44%;
    padding: calc(var(--w) * .05);
  }
  .pp-pc-kind {
    position: absolute; left: 0; right: 0; top: calc(var(--w) * .022); text-align: center;
    font: 600 calc(var(--w) * .03) "Cormorant Garamond", serif; letter-spacing: .3em; color: #8a6a55;
  }
  .pp-pc-note {
    border-right: 1px solid rgba(120,90,60,.35);
    padding: calc(var(--w) * .05) calc(var(--w) * .04) 0 0;
    font-family: Caveat, cursive; font-size: calc(var(--w) * .062); line-height: 1.15;
    overflow: hidden;
  }
  .pp-pc-right { position: relative; padding-left: calc(var(--w) * .04); }
  .pp-pc-stamp {
    position: absolute; right: 0; top: calc(var(--w) * .02);
    width: calc(var(--w) * .15); height: calc(var(--w) * .18);
    background: #fffaf2; border: calc(var(--w) * .008) dotted #f2e8d4;
    padding: calc(var(--w) * .01);
    transform: rotate(3deg);
    box-shadow: 0 1px 1px rgba(0,0,0,.12);
  }
  .pp-pc-stamp div {
    width: 100%; height: 100%; background: var(--wax);
    display: grid; place-items: center; color: #fff3e6;
    font-size: calc(var(--w) * .07); line-height: 1;
  }
  .pp-pc-lines {
    position: absolute; left: calc(var(--w) * .04); right: 0; bottom: calc(var(--w) * .04);
  }
  .pp-pc-lines div {
    height: calc(var(--w) * .07); border-bottom: 1px solid rgba(120,90,60,.4);
    font-family: Caveat, cursive; font-size: calc(var(--w) * .055); line-height: calc(var(--w) * .08);
  }

  /* ================================================================ */
  /* the three polaroid directions                                    */
  /*   A · candid  — Instax, bold tilt, torn washi, marker caption,   */
  /*                 develops from milky to full colour as it lands   */
  /*   B · kept    — faded square Polaroid, yellowed clear tape,      */
  /*                 pencil caption, barely tilted                    */
  /*   C · placed  — one large Polaroid 600, nearly straight, a faint */
  /*                 strip of tape, the handwriting flows around it   */
  /* Shared: real film proportions (--pt/--ps/--pb), a contact shadow */
  /* (it lies on the paper), a recessed picture window, lifted blacks */
  /* ================================================================ */
  .ip {
    position: relative; width: var(--w); margin: 0; flex: 0 0 auto;
    transform: rotate(var(--tilt, 0deg));
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .ip::before {  /* the untaped bottom edge lifts a hair off the page */
    content: ""; position: absolute; z-index: -1; left: 6%; right: 6%; bottom: 1%; height: 30%;
    box-shadow: 0 calc(var(--w) * .02) calc(var(--w) * .034) calc(var(--w) * -.012) rgba(40,25,10,.34);
  }
  .ip-frame {
    position: relative;
    padding: var(--pt) var(--ps) 0;
    background-color: var(--card);
    background-image: var(--grain), linear-gradient(162deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 42%, rgba(0,0,0,.035) 100%);
    border-radius: calc(var(--w) * .006);
    box-shadow: 0 0 0 .5px rgba(60,40,20,.12), 0 .7px 1.3px rgba(40,25,10,.30);
  }
  .ip-win { position: relative; overflow: hidden; isolation: isolate; background: #1c1714; }
  .ip-win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ip-lift { position: absolute; inset: 0; background: var(--lift); mix-blend-mode: lighten; pointer-events: none; }
  .ip-edge {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.2),
      inset 0 calc(var(--w) * .005) calc(var(--w) * .012) rgba(0,0,0,.32),
      inset 0 0 calc(var(--w) * .09) var(--falloff);
  }
  .ip-dev {  /* instant film comes out milky and develops */
    position: absolute; inset: 0; pointer-events: none;
    background: #e6e1d2; opacity: .94;
  }
  .ip-dev.go { opacity: 0; transition: opacity 2.8s cubic-bezier(.3,.1,.3,1) .5s; }
  .ip-cap {
    height: var(--pb); display: flex; align-items: center; gap: 6%;
    padding: 0 7%; overflow: hidden; white-space: nowrap;
  }
  .ip-tape { position: absolute; z-index: 3; pointer-events: none; }
  .tape-washi {
    background-color: var(--t); background-image: var(--grain);
    opacity: .74; mix-blend-mode: multiply;
  }
  .tape-clear {
    background:
      linear-gradient(100deg, rgba(255,255,255,0) 16%, rgba(255,255,255,.5) 28%, rgba(255,255,255,0) 40%),
      linear-gradient(180deg, rgba(246,228,168,.62), rgba(230,206,140,.5));
    box-shadow: inset 0 1px 0 rgba(130,100,50,.5), inset 0 -1px 0 rgba(130,100,50,.5), 0 .5px 1px rgba(90,70,30,.18);
  }
  .tape-faint { background-color: var(--t); background-image: var(--grain); opacity: .4; mix-blend-mode: multiply; }

  .ip-candid { --card: #f7f6f1; --lift: rgb(36,31,29); --falloff: rgba(0,0,0,.08); }
  .ip-candid .ip-win img { filter: contrast(.93) saturate(1.06) brightness(1.03); }
  .ip-candid .ip-cap { font-family: Neucha, Caveat, cursive; color: #26201c; font-size: max(15px, calc(var(--w) * .095)); }
  .ip-candid .ip-date { margin-left: auto; font-size: .7em; color: #6c625a; }

  .ip-kept { --card: #f1ebdd; --lift: rgb(72,58,46); --falloff: rgba(236,214,168,.5); }
  .ip-kept .ip-frame { background-image: var(--grain), linear-gradient(162deg, rgba(255,250,235,.45), rgba(220,200,160,.14)); }
  .ip-kept .ip-win img { filter: contrast(.82) saturate(.68) sepia(.2) brightness(1.06); }
  .ip-kept .ip-cap { font-family: "Bad Script", Caveat, cursive; color: #7a746d; font-size: max(13px, calc(var(--w) * .06)); justify-content: flex-end; }

  .ip-placed { --card: #f8f7f3; --lift: rgb(26,32,36); --falloff: rgba(0,0,0,.13); }
  .ip-placed .ip-win img { filter: contrast(.91) saturate(.92) brightness(1.02); }
  .ip-placed .ip-lift::after { content: ""; position: absolute; inset: 0; background: rgba(0,70,90,.05); }
  .ip-placed .ip-cap { font-family: Caveat, cursive; font-weight: 500; color: #3a2820; font-size: max(16px, calc(var(--w) * .085)); justify-content: center; }

  .lb .ip::before { opacity: .0; }
  .lb .ip-frame { box-shadow: 0 20px 50px rgba(0,0,0,.5); }

  /* C on a laptop: the handwriting flows around the photo */
  .pl-slot.float-left  { float: left;  margin: 8px 18px 12px -14px; }
  .pl-slot.float-right { float: right; margin: 8px -14px 12px 18px; }
  /* A: hangs out into the paper's margin */
  .pl-slot.single.left.hang  { margin-left: -26px; padding-left: 0; }
  .pl-slot.single.right.hang { margin-right: -26px; padding-right: 0; }
  .pl-slot.many.overlap { gap: 0; }
  .pl-slot.many.overlap > .pl-item:nth-child(2n) { margin-left: -16%; margin-top: 9%; }
  .pl-slot { position: relative; }

  /* ---- on the letter paper ---- */
  .pl-slot { display: flex; justify-content: center; align-items: flex-start; margin: 22px 0 26px; }
  .pl-slot.single.left  { justify-content: flex-start; padding-left: 2%; }
  .pl-slot.single.right { justify-content: flex-end; padding-right: 2%; }
  .pl-slot.many { flex-wrap: wrap; gap: 18px 0; }
  .pl-slot.many > .pl-item:nth-child(2n) { margin-left: -6%; margin-top: 7%; }
  .pl-item { display: flex; flex-direction: column; align-items: center; }

  /* ---- tucked in the envelope: slide out to both sides of it ---- */
  .pl-pile { position: absolute; left: 50%; width: 0; height: 154px; z-index: -1; }
  .pl-pile .pl-pile-item {
    position: absolute; top: 50%;
    transition: transform .9s cubic-bezier(.3,.9,.3,1), opacity .5s;
  }
  .pl-more {
    position: absolute; top: 100%; margin-top: 4px; white-space: nowrap;
    font-family: Caveat, cursive; font-size: 19px; color: rgba(255,243,230,.85);
    transform: translateX(-50%); pointer-events: none;
    animation: fadeIn .5s 2.6s both;
  }

  /* ---- the full-screen viewer ---- */
  .lb {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(10,6,4,.9); backdrop-filter: blur(3px);
    display: grid; place-items: center;
    animation: fadeIn .3s ease both;
    touch-action: none; user-select: none; -webkit-user-select: none;

  .lb-photo { animation: lbIn .45s cubic-bezier(.3,.9,.3,1) both; }
  @keyframes lbIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  .lb .pp-under { color: rgba(255,243,230,.88); }
  .lb-close, .lb-arrow {
    position: absolute; width: 42px; height: 42px; border-radius: 21px;
    border: 1px solid rgba(255,243,230,.22); background: rgba(20,10,6,.5);
    color: #fff3e6; font-size: 18px; cursor: pointer; display: grid; place-items: center;
  }
  .lb-close { top: 18px; right: 18px; font-size: 22px; }
  .lb-arrow { top: 50%; transform: translateY(-50%); }
  .lb-arrow[disabled] { opacity: .18; cursor: default; }
  .lb-count {
    position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
    font-family: Caveat, cursive; font-size: 21px; color: rgba(255,243,230,.75);
  }
  .lb-flip {
    position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%);
    font-family: Caveat, cursive; font-size: 21px; padding: 6px 18px; border-radius: 999px;
    border: 1px solid rgba(255,243,230,.3); background: rgba(20,10,6,.6); color: #fff3e6; cursor: pointer;
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .back-btn { padding: 9px 16px; font-size: 12px; }

  }
  @media (max-width: 520px) {
    .lab-bar { gap: 6px 10px; padding: 6px 8px; font-size: 11px; }

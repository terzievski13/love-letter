# Asks the mailbox whether any letter has gone live without being announced.
#
# The endpoint is idempotent, so calling it often is harmless - it only ever
# sends something the first time a given letter becomes visible.
#
#   on push    - a letter you just uploaded is announced within ~2 minutes
#   schedule   - catches letters that unlock on a timer, to the quarter hour
#
# Vercel's own cron (see vercel.json) runs once a day as a backstop, in case
# GitHub disables this schedule - which it does automatically in repositories
# with no commits for 60 days.

name: notify

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Let the Vercel deploy finish first
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check for unannounced letters
        env:
          SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          set -o pipefail
          code=$(curl -sS --max-time 60 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $SECRET" \
            "https://lovelettersisa.vercel.app/api/notify-check")
          echo "HTTP $code"
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::notify-check returned HTTP $code"
            exit 1
          fi

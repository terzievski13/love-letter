<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>letters, from me</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">

<style>
  * { box-sizing: border-box; }
  html, body {
    color-scheme: light;
    margin: 0; padding: 0;
    height: 100%;
    background: #2a1a14;
    overflow: hidden;
    font-family: Fraunces, "Times New Roman", serif;
    color: #3a2820;
    -webkit-font-smoothing: antialiased;
  }
  #app, .root { position: fixed; inset: 0; overflow: hidden; }

  .three-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    /* holding the mailbox opens the writing tool - keep the phone's own
       long-press menu, text selection and tap flash out of the way */
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(20,12,8,0) 25%, rgba(20,12,8,0.8) 75%);
    pointer-events: none;
    transition: opacity 1.2s ease;
  }

  .interior {
    position: absolute; inset: 0;
    animation: fadeIn 0.7s ease both;
  }

  /* ---- the letter deck (deck.jsx) ---- */
  .deck { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .deck-card { position: absolute; left: 50%; top: 50%; width: 360px; height: 230px; margin: -115px 0 0 -180px; cursor: pointer; }
  .deck-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 21px; z-index: 300;
    border: 1px solid rgba(255,243,230,.22); background: rgba(20,10,6,.5);
    color: #fff3e6; font-size: 18px; cursor: pointer; display: grid; place-items: center;
    backdrop-filter: blur(6px);
  }
  .deck-arrow:hover { background: rgba(40,20,12,.8); }
  .deck-arrow[disabled] { opacity: .18; cursor: default; }
  .deck-rail {
    position: absolute; left: 12%; right: 12%; bottom: 46px; height: 26px; z-index: 300;
    display: flex; align-items: center; touch-action: none; cursor: pointer;
  }
  .deck-rail-track { position: relative; height: 3px; width: 100%; border-radius: 2px; background: rgba(255,243,230,.16); }
  .deck-rail-thumb { position: absolute; top: -3px; height: 9px; border-radius: 5px; background: #e8c79a; }
  .deck-cap {
    position: absolute; left: -60px; right: -60px; top: 100%; margin-top: 16px;
    text-align: center; transition: opacity .3s ease; pointer-events: none;
  }
  .deck-cap-title { font-family: Caveat, cursive; font-size: 27px; line-height: 1.15; color: #fff3e6; }
  .deck-cap-date {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; color: rgba(255,243,230,.45); margin-top: 3px;
  }
  .deck-pos {
    position: absolute; left: 0; right: 0; bottom: 74px; text-align: center; z-index: 300;
    font-family: Caveat, cursive; font-size: 19px; color: rgba(255,243,230,.75);
  }
  /* while the "should I ring you?" prompt is up, it owns the bottom of the
     screen — the counter and slider move up above it */
  .interior:has(.notify-slot > *) .deck-pos { bottom: 178px; }
  .interior:has(.notify-slot > *) .deck-rail { bottom: 150px; }

  /* a letter she hasn't opened yet glows softly and gets a "ново" tag */
  @keyframes newPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,206,130,.42), 0 8px 18px rgba(0,0,0,.4); }
    50%     { box-shadow: 0 0 22px 5px rgba(255,206,130,.30), 0 8px 18px rgba(0,0,0,.4); }
  }
  .is-new { animation: newPulse 2.8s ease-in-out infinite; }
  .is-read { filter: saturate(.86) brightness(.9); }
  .new-tag {
    font-family: Caveat, cursive; font-size: 15px; color: #3a2820;
    background: #ffd79a; border-radius: 999px; padding: 0 8px;
    line-height: 19px; display: inline-block; white-space: nowrap;
  }

  /* the open letter, over a dimmed mailbox */
  .reader { position: fixed; inset: 0; z-index: 1000; }
  .reader-scrim { position: absolute; inset: 0; background: rgba(12,7,4,.72); }
  .reader-stage { position: absolute; inset: 0; pointer-events: none; }
  .reader-stage > * { pointer-events: auto; }
  .reader-ghost {
    position: absolute; left: 50%; top: 50%; width: 360px; height: 230px;
    margin: -115px 0 0 -180px; filter: drop-shadow(0 24px 36px rgba(0,0,0,.45));
    perspective: 1000px; transform-style: preserve-3d;
  }

  .back-btn {
    position: absolute; top: 24px; left: 24px;
    padding: 15px 27px;
    border-radius: 999px;
    border: 1px solid rgba(255,243,230,0.25);
    background: rgba(20,10,6,0.55);
    color: #fff3e6;
    font-family: Fraunces, serif;
    font-size: 14px;
    font-style: italic;
    cursor: pointer;
    backdrop-filter: blur(8px);
    z-index: 200;
  }
  .back-btn:hover { background: rgba(40,20,12,0.85); }

  .outside-hint {
    position: absolute;
    left: 50%; bottom: 44px;
    transform: translateX(-50%);
    color: #3a2820;
    font-family: Caveat, cursive;
    font-size: 22px;
    text-align: center;
    opacity: 0.85;
    animation: bob 2.6s ease-in-out infinite;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(255,243,230,0.6);
  }
  .hint-arrow { font-size: 28px; opacity: 0.7; }

  .inside-hint {
    position: absolute;
    left: 50%; top: 8%;
    transform: translateX(-50%);
    color: #fff3e6;
    font-family: Caveat, cursive;
    font-size: 26px;
    opacity: 0.7;
    pointer-events: none;
    z-index: 5;
    animation: bobSm 3s ease-in-out infinite;
  }

  .title {
    position: absolute; top: 36px;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 1px 12px rgba(255,243,230,0.35);
  }
  .title-sub {
    font-family: Caveat, cursive;
    color: #5a2a1a;
    font-size: 18px;
    opacity: 0.9;
  }
  .title-main {
    font-family: Fraunces, serif;
    font-style: italic;
    font-size: 36px;
    color: #2a1a14;
  }

  /* ---- the secret writing tool (writer.jsx) ---- */
  .writer { position: fixed; inset: 0; z-index: 2000; animation: fadeIn .3s ease both; }
  .writer-scrim { position: absolute; inset: 0; background: rgba(12,7,4,.8); }
  .writer-scroll {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; padding: 56px 14px 40px;
  }
  .writer-card {
    width: min(520px, 100%); margin: auto; border-radius: 6px; padding: 22px 22px 20px;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(120,90,60,0.11) 31px, rgba(120,90,60,0.11) 32px),
      linear-gradient(180deg, #fdf6e9 0%, #f6e9d2 100%);
    color: #3a2820; box-shadow: 0 30px 60px rgba(0,0,0,.5);
    font-family: Fraunces, serif;
  }
  .writer-narrow { width: min(380px, 100%); }
  .writer-head { margin: -6px 0 6px; }
  .writer-title { margin: 0 0 14px; font-style: italic; font-weight: 400; font-size: 24px; }
  .writer-hand { font-family: Caveat, cursive; }
  .writer-input {
    width: 100%; border: 0; border-bottom: 1px solid rgba(120,90,60,.35); border-radius: 0;
    background: transparent; color: #3a2820; outline: none; font-family: inherit; font-size: 17px;
    padding: 6px 2px;
  }
  .writer-input.writer-hand { font-family: Caveat, cursive; font-size: 24px; }
  .writer-body {
    min-height: 260px; resize: vertical; line-height: 32px; margin-top: 12px;
    border: 1px dashed rgba(120,90,60,.3); border-radius: 4px; padding: 4px 8px;
  }
  .writer-input:focus { border-color: #8c4658; }
  .writer-row { margin-top: 16px; }
  .writer-label {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: #8a6a58; margin-bottom: 8px;
  }
  .writer-hint { font-size: 13px; color: #8a6a58; margin-top: 6px; font-style: italic; }
  .writer-error { font-size: 14px; color: #a5443a; margin-top: 10px; }
  .writer-text { font-size: 16px; line-height: 1.5; margin: 0; }
  .writer-swatches { display: flex; flex-wrap: wrap; gap: 9px; }
  .writer-swatches button, .writer-custom {
    width: 32px; height: 32px; border-radius: 16px; cursor: pointer; padding: 0;
    border: 2px solid rgba(58,40,32,.18);
  }
  .writer-swatches [data-on="1"] { border-color: #3a2820; box-shadow: inset 0 0 0 2px #fdf6e9; }
  .writer-custom {
    position: relative; display: grid; place-items: center; overflow: hidden;
    font-size: 18px; color: #8a6a58; background: transparent;
  }
  .writer-custom[data-on="1"] { color: transparent; }
  .writer-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .writer-preview { display: flex; justify-content: center; margin: 20px 0 4px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
  .writer-seg { display: inline-flex; border: 1px solid rgba(58,40,32,.3); border-radius: 999px; overflow: hidden; }
  .writer-seg button {
    border: 0; background: transparent; padding: 7px 20px; cursor: pointer;
    font-family: Fraunces, serif; font-style: italic; font-size: 15px; color: #3a2820;
  }
  .writer-seg [data-on="1"] { background: #3a2820; color: #fdf6e9; }
  .writer-when { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .writer-when .writer-input { width: auto; flex: 0 1 170px; }
  .writer-actions { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 20px; }
  .writer-primary {
    border: 0; border-radius: 999px; padding: 11px 24px; cursor: pointer;
    background: #8c4658; color: #fff3e6; font-family: Fraunces, serif; font-style: italic; font-size: 16px;
    transition: background .2s;
  }
  .writer-primary.is-sure { background: #a5443a; }
  .writer-primary[disabled] { opacity: .4; cursor: default; }
  .writer-wide { width: 100%; }
  .writer-link {
    border: 0; background: transparent; padding: 4px 0; cursor: pointer;
    font-family: Fraunces, serif; font-style: italic; font-size: 15px; color: #8c4658;
  }
  .writer-list { margin-top: 14px; }
  .writer-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 0; border-top: 1px solid rgba(120,90,60,.18); background: transparent;
    padding: 10px 4px; cursor: pointer; color: #3a2820;
  }
  .writer-item:hover { background: rgba(120,90,60,.07); }
  .writer-dot { flex: 0 0 auto; width: 26px; height: 18px; border-radius: 3px; border: 3px solid; }
  .writer-item-text { display: flex; flex-direction: column; min-width: 0; }
  .writer-item-title { font-size: 22px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .writer-item-when { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; color: #8a6a58; }
  .writer-foot { margin-top: 16px; }
  .writer-close {
    position: fixed; top: 12px; right: 12px; z-index: 2001;
    width: 38px; height: 38px; border-radius: 19px; cursor: pointer;
    border: 1px solid rgba(255,243,230,.25); background: rgba(20,10,6,.6);
    color: #fff3e6; font-size: 22px; line-height: 1;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bob {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-6px); }
  }
  @keyframes bobSm {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-4px); }
  }

  @media (max-width: 720px) {
    .title { top: 56px; }
    .title-main { font-size: 21px; }
    .title-sub { font-size: 12px; }
    .back-btn { padding: 9px 16px; font-size: 12px; }
    .inside-hint { top: 14%; }
    /* the open letter reads at 80% on phones, as it always has
       (READER_SCALE in deck.jsx must match) */
    .reader-stage {
      transform: scale(0.8);
      transform-origin: 50% 50%;
    }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <!-- GLTFLoader only ships as an ES module (three.js dropped the classic
       examples/js build). This import map lets three-scene.js pull it in
       via a dynamic import() at runtime without switching the whole app
       (and its global THREE) over to modules. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="three-scene.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="letters.jsx"></script>
  <script type="text/babel" src="envelope.jsx"></script>
  <script type="text/babel" src="deck.jsx"></script>
  <script type="text/babel" src="notify.jsx"></script>
  <script type="text/babel" src="writer.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>
</body>
</html>
